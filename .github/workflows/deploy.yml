name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # "Run workflow" button
  repository_dispatch: # fired by the Sanity webhook when she publishes
    types: [sanity-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            studio/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
        env:
          # Pages serves this repo at /scar4ever/
          ASTRO_BASE: /scar4ever
      - name: Install studio
        working-directory: studio
        run: npm ci
      - name: Build studio (her admin, served at /admin)
        working-directory: studio
        run: npx sanity build --no-minify
        env:
          SANITY_STUDIO_BASEPATH: /scar4ever/admin
      - name: Put the studio inside the site
        run: |
          mkdir -p web/dist/admin
          cp -r studio/dist/* web/dist/admin/
          # TEMPORARY: on this host the studio's router re-applies its basePath,
          # so once you're logged in it lazy-loads chunks from
          # /admin/scar4ever/admin/static/... Serving a second copy there keeps
          # it working. Remove when the admin moves to a root path on Netlify.
          mkdir -p web/dist/admin/scar4ever/admin
          cp -r studio/dist/* web/dist/admin/scar4ever/admin/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
